<script>
    // ==========================================
    // INPUT CONTROLS CLASSES
    // ==========================================

    // A text input which can be cleared with an X button 
    class ClearableTextInput {
        // 1. Accept an optional callback function
        constructor(inputElementId, clearBtnId, onChangeCallback = null) {
            this.input = document.getElementById(inputElementId);
            this.clearBtn = document.getElementById(clearBtnId);
            this.onChangeCallback = onChangeCallback; // Save reference

            this.init();
        }

        init() {
            this.input.addEventListener('input', () => {
                this.clearBtn.style.display = this.input.value.length > 0 ? 'block' : 'none';

                // 2. Trigger callback on input changes (typing/deleting)
                this.triggerCallback();
            });

            this.clearBtn.addEventListener('click', () => {
                this.input.value = '';
                this.clearBtn.style.display = 'none';
                this.input.focus();

                // 3. Trigger callback when the clear button resets the field
                this.triggerCallback();
            });
        }

        getValue() {
            return this.input.value.trim();
        }

        // Helper method to safely fire the callback if it exists
        triggerCallback() {
            if (typeof this.onChangeCallback === 'function') {
                this.onChangeCallback(this.getValue());
            }
        }
    }

    class TagPicker {
        constructor(containerId, defaultLabel, optionsList, onChangeCallback = null) {
            this.rootContainer = document.getElementById(containerId);
            if (!this.rootContainer) return;

            this.defaultLabel = defaultLabel; 
            this.options = optionsList;
            this.selected = new Set();
            this.onChangeCallback = onChangeCallback;
            
            // Generate HTML structure
            this.buildStructure();

            this.initEvents();
            this.renderChips();
            this.updateLabelText();
        }

        // Function to generate HTML structure
        buildStructure() {
            this.rootContainer.classList.add('tag-picker-btn-container');

            // Filter button
            this.label = document.createElement('button');
            this.label.type = 'button';
            this.label.className = 'tag-picker-btn';
            
            // Hidden container for filter options, to be shown when the
            // user clicks on the button
            this.container = document.createElement('div');
            this.container.className = 'tag-picker-dropdown';

            this.innerClearBtn = document.createElement('span');
            this.innerClearBtn.className = 'tag-picker-inner-clear';
            this.innerClearBtn.innerHTML = '&#10005;'; // Cross sign
            this.innerClearBtn.title = 'Clear filter';

            this.rootContainer.appendChild(this.label);
            this.rootContainer.appendChild(this.container);
            this.label.appendChild(this.innerClearBtn);
        }

        initEvents() {
            this.label.addEventListener('click', (e) => {
                e.stopPropagation();
                
                // Close options for any filter on the pge
                document.querySelectorAll('.tag-picker-dropdown.open').forEach(openContainer => {
                    if (openContainer !== this.container) {
                        openContainer.classList.remove('open');
                    }
                });

                const isOpen = this.container.classList.contains('open');

                if (!isOpen) {
                    // Open the overlay
                    this.container.classList.add('open');
                } else {
                    this.container.classList.remove('open');
                }
            });

            // Process clicking on the Clear button within a filter
            this.innerClearBtn.addEventListener('click', (e) => {
                // Do not treat the click as the click on the filter button 
                // itself -- i.e., the dropdown should not show up if it's
                // not already open
                e.stopPropagation(); 
                this.clear();        
                // Close the dropdown if it was open
                this.container.classList.remove('open');
            });

            document.addEventListener('click', (e) => {
                if (!this.rootContainer.contains(e.target)) {
                    this.container.classList.remove('open');
                }
            });
        }

        renderChips() {
            this.container.innerHTML = '';
            this.container.appendChild(this.innerClearBtn);
            
            this.options.forEach(tag => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = tag;
                
                chip.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    this.toggleTag(tag, chip);
                });
                
                this.container.appendChild(chip);
            });
        }

        toggleTag(tag, element) {
            let action = '';
            
            if (this.selected.has(tag)) {
                this.selected.delete(tag);
                element.classList.remove('selected');
                action = 'deselected';
            } else {
                this.selected.add(tag);
                element.classList.add('selected');
                action = 'selected';
            }
            
            this.updateLabelText();
            
            if (this.onChangeCallback) {
                this.onChangeCallback();
            }
        }

        clear() {
            if (this.selected.size === 0) return;

            this.selected.clear();
            
            // Deselect all individual chips
            this.container.querySelectorAll('.chip.selected').forEach(chip => {
                chip.classList.remove('selected');
            });

            this.updateLabelText();

            if (this.onChangeCallback) {
                this.onChangeCallback();
            }
        }

        updateLabelText() {
            const currentList = this.getSelected().sort();
            if (currentList.length === 0) {
                this.label.textContent = `${this.defaultLabel}: All`;
                this.label.classList.remove('filtered');
                this.innerClearBtn.style.display = 'none';
            } else {
                this.label.textContent = `${this.defaultLabel}: ${currentList.join(', ')}`;
                this.label.classList.add('filtered');
                this.innerClearBtn.style.display = 'inline-flex';
                this.label.appendChild(this.innerClearBtn);
            }
        }

        getSelected() {
            return Array.from(this.selected);
        }
    }
    
    // A class for an object to hold global app state
    class appState extends EventTarget {
        #state = {};
        
        constructor() {
            super();
            
            this.#state = {
                activeRecordingName: null,
                prevRecordingButton: null,
                activeRecordingButton: null,
                currentTranscript: null,
                currentAudio: null,
                annotationButtons: []
            }
        }

        getState = function() {
            return this.#state
        }

        setCurrentRecording = function(recordingName) {
            const currentTranscript = findTranscript(recordingName);
            const currentButton = findRecordingButton(recordingName);

            this.#state.activeRecordingName = recordingName;
            // Remember which button was just active to deactivate it
            this.#state.prevRecordingButton = this.#state.activeRecordingButton
            // Record the new active button
            this.#state.activeRecordingButton = currentButton;
            this.#state.currentTranscript = currentTranscript;
            this.#state.currentAudio = currentTranscript.filename;
            this.updateAnnotationButtons()

            // Create a custom event
            const event = new CustomEvent('recordingChange', { 
                detail: this.getState() 
            });
            
            // Broadcast the event to all listeners
            this.dispatchEvent(event);
        }

        // Create annotation buttons -- this function will execute when a 
        // recording is changed, and the global state object is updated
        updateAnnotationButtons = function() {
            this.#state.annotationButtons = [];

            // Create a new set of annotation chips

            // Make sure that annotations are sorted in increasing order by
            // timestamps
            const sortedAnnotations = this.#state.currentTranscript.annotations
                                        .sort((a, b) => a.start - b.start);

            sortedAnnotations.forEach((ann, index) => {
                const tierId = ann.TIER_ID;

                const btn = document.createElement('button');
                btn.innerHTML = `<strong>${tierId}:</strong> ${ann.content}`;
                btn.dataset.start = ann.start;
                btn.dataset.end = ann.end;
                btn.dataset.index = index;

                // Allow styling of notes in the annotations
                if (tierId === annNoteTier) {
                    btn.classList.add("annotation-note");
                    // If the config says so, disable clicking on annotation
                    // notes
                    if (!clickableAnnotationNotes) {
                        btn.disabled = true;
                    }
                }

                btn.onclick = () => {
                    audio.currentTime = ann.start / 1000;
                    audio.play();
                    setTimeout(() => {
                        btn.scrollIntoView({behavior: 'smooth', block: 'center'});
                        btn.classList.add('highlight');
                    }, 200);
                };

                this.#state.annotationButtons.push(btn);
            });
        }
    } 

    // ==========================================
    // Functions
    // ==========================================

    /**
     * Converts a string to a safe HTML name
     *
     * @param {String} str - input string.
     * @returns {String} Sanitized string.
     */
    function toSafeHtmlName(str) {
        return str
            .trim()                       // Remove leading/trailing whitespace
            .toLowerCase()                // Enforce lowercase
            .replace(/[^a-z0-9-_]/g, '-') // Replace illegal characters with a hyphen
            .replace(/-+/g, '-')          // Collapse consecutive hyphens
            .replace(/^-+|-+$/g, '');     // Remove leading/trailing hyphens
    };

    /**
     * Find transcript by the recording's name 
     *
     * @param {String} recordingName - Name of the recording as displayed on 
     *   the recording button. 
     */
    // 
    function findTranscript(recordingName) {
        // We are guaranteed that there will be a match: recordingName will
        // come from a file button, and all file buttons are created based on
        // transcripts.
        return transcripts.find(t => t.displayName == recordingName)
    }

    /**
     * Find recording button by recording's name
     *
     * @param {String} recordingName - Name of the recording as displayed on 
     *   the recording button. 
     * @returns {Element} Button associated with this recording
     */
    function findRecordingButton(recordingName) {
        return fileButtons.find(btn => btn.textContent === recordingName)
    }

    /**
     * Filters file list depending on the values in filter inputs
     */
    function filterFileList() {

        const filtersSelected = Object.fromEntries(
            Object.entries(tagPickers).map(([key, value]) => {
                return [key, value.getSelected()];
            })
        );

        const queries = Object.fromEntries(
            Object.entries(filtersSelected).map(([key, value]) => {
                if (filtersSelected[key].length !== 0) {
                    return [key, filtersSelected[key]]
                } else {
                    return [key, speakersAttrs[key]]
                }
            })
        );

        const nameQuery = speakerFilterBox.getValue().toLowerCase();

        let numberMatchingRecordings = 0;

        filteredData = [];

        // Remember buttons initial positions (to animate movements for the
        // search matches)
        const firstPositions = [];
        fileButtons.forEach(btn => {
            firstPositions.push(btn.getBoundingClientRect());
        });

        // Find recordings which match the specified filters
        fileButtons.forEach(btn => {
            const file = findTranscript(btn.textContent)
  
            // Check if this file contains a matching speaker
            const matchedSpeakers = speakers.filter(sp => {
                const queryMatches = Object.entries(queries).map(([key, value]) => {
                    // Test for values followed by ";" or end of line, to 
                    // make sure that in attributes with multiple values only
                    // the entire values produce the match
                    //
                    // E.g., that with values like "test;test2" choosing "test"
                    // as the query doesn't select items which only have "test2"
                    const regex = value.map(v => new RegExp(`(^|;)${RegExp.escape(v)}(;|$)`))
                    return regex.some(re => re.test(sp[key]));
                })

                allQueriesMatch = queryMatches.every(q => q === true)

                return allQueriesMatch &&
                    sp.Name.toLowerCase().includes(nameQuery) &&
                    file.displayName.toLowerCase().includes(sp.Name.toLowerCase());
            });

            //If no filter terms are entered, remove filter-related styles
            if (Object.values(filtersSelected).every(val => val.length === 0) && 
                nameQuery.length === 0) {
                    btn.classList.remove('search-match');
                    btn.disabled = false;
                    filteredData = transcripts;
                    numberMatchingRecordings = -1;
            } else { // If the user specified filter terms...
                if (matchedSpeakers.length === 0) { // Style and disable unmatched recordings
                    btn.classList.remove('search-match');
                    btn.disabled = true;
                } else { // Style and enable matched recordings
                    btn.classList.add('search-match');
                    btn.disabled = false;
                    filteredData.push(file);
                    numberMatchingRecordings = numberMatchingRecordings + 1;
                }
            }
        });

        // Update the filterBox header with the number of matching recordings 
        // (only show the number if at least one filter is active)
        if (numberMatchingRecordings === -1){
            filtersBoxHeader.innerHTML = `Filter recordings`;
        } else {
            filtersBoxHeader.innerHTML = `Filter recordings (${numberMatchingRecordings} found)`;
        }

        // Animate the buttons movement
        fileButtons.forEach((btn, index) => {
            const startPos = firstPositions[index];
            const endPos = btn.getBoundingClientRect();

            // Calculate how far the button actually moved
            const invertY = startPos.top - endPos.top;
            const invertX = startPos.left - endPos.left;

            // If the button moved, slide it smoothly
            if (invertY !== 0 || invertX !== 0) {
            btn.animate([
                { transform: `translate(${invertX}px, ${invertY}px)` }, // Start at old position
                { transform: 'translate(0, 0)' }                        // Slide to new position
            ], {
                duration: 500,        // Animation speed in milliseconds 
                easing: 'ease-in-out' // Smooth start and stop acceleration
            });
            }
        });
        
        // Simulate input to the search box, so that the search function is
        // run and the results are updated. This is needed when the search
        // terms are entered first, and only then some filter are applied
        searchBox.triggerCallback()
    }

    /**
     * Searches transcripts depending on the query in the search fields
     * @param {String} value - search string
     */
    function searchAnnotations(value) {
        const state = store.getState();
        const query = searchBox.getValue().toLowerCase();
        searchResults.innerHTML = '';
        if (!query) {
            // If the search box is empty, show file list again
            fileList.style.display = 'flex';
            return;
        }

        filteredData.forEach(file => {
            const fileMatches = [];

            // --- Check annotations ---
            file.annotations.forEach(ann => {
                const contentLower = ann.content.toLowerCase();
                if (contentLower.includes(query)) {
                    const regex = new RegExp(`(${query})`, 'gi');
                    const highlighted = ann.content.replace(regex, '<span class="highlight">$1</span>');

                    const snippetBtn = document.createElement('button');
                    snippetBtn.innerHTML = `<strong>${ann.TIER_ID}:</strong> ${highlighted}`;

                    snippetBtn.onclick = () => {
                        store.setCurrentRecording(file.displayName);

                        audio.currentTime = ann.start / 1000;
                        audio.play();

                        setTimeout(() => {
                            const targetBtn = state.annotationButtons.find(
                                b => parseInt(b.dataset.start) === ann.start
                            );
                            if (targetBtn) {
                                targetBtn.scrollIntoView({behavior: 'smooth', block: 'center'});
                                targetBtn.classList.add('highlight');
                            }
                        }, 200);
                    };

                    fileMatches.push(snippetBtn);
                }
            });

            // --- Render results ---
            if (fileMatches.length > 0) {
                const fileHeader = document.createElement('h3');
                fileHeader.textContent = file.displayName;
                searchResults.appendChild(fileHeader);
                fileMatches.forEach(btn => searchResults.appendChild(btn));
                // Hide file list buttons -- only search results will be shown
                // if search returned any results
                fileList.style.display = "none";
            } 
        });

        if (searchResults.innerHTML === ''){
            const noResults = document.createElement('h3');
            noResults.textContent = "No search match found";
            searchResults.appendChild(noResults);
        }
    };

    /**
     * Loads recording using the info in the global state object
     * 
     * The function loads the audio file, creates speaker cards, displays
     * associated transcripts
     */
    function loadFile() {
        const state = store.getState()

        audio.src = state.currentAudio;

        audio.play();
        createSpeakerCards();
        displayAnnotations();
    }

    /**
     * Creates cards with speaker info
     */
    function createSpeakerCards() {

        const state = store.getState()

        const speakerCardsDiv = document.getElementById('speakerCards');
        if (speakerCardsDiv) speakerCardsDiv.innerHTML = '';
        
        // --- SPEAKER CARDS ---
        const matchedSpeakers = speakers.filter(s => {
            const fullName = s.Name.toLowerCase();
            return state.activeRecordingName.toLowerCase().includes(fullName);
        });

        matchedSpeakers.forEach(match => {           
            const card = document.createElement('div');
            card.className = 'speaker-card';
            card.innerHTML = `<h3>${match.Name}</h3>`;
            for (const [key, value] of Object.entries(match)) {
                // For values, we treat ";" as separator, which for presentation
                // purposes is replaced with ", "
                card.innerHTML = card.innerHTML + `<p><span class="label">${key}:</span> ${value.replace(";", ", ")}</p>`
            }
            speakerCardsDiv.appendChild(card);
        });
    }

    /**
     * Displays annotations stored in the global app state object
     */
    function displayAnnotations() {
        const state = store.getState();
        annotationsDiv.innerHTML = '';

        state.annotationButtons.forEach(btn => {
            annotationsDiv.appendChild(btn);
        })
        // Scroll to the top of the annotations list
        annotationsDiv.scrollTo({top: 0, behavior: 'smooth'});
    }

    /**
     * Process changes when a different recording is selected
     * 
     * @param {Event} event Event triggered when the recording is updated
     */
    function handleRecordingUpdate(event) {
        const state = event.detail; 

        if (state.prevRecordingButton !== null) {
            state.prevRecordingButton.classList.remove('active-file');
        }
        
        state.activeRecordingButton.classList.add('active-file');
        loadFile(state.currentTranscript)
    }

    // ==========================================
    // Initialization
    // ==========================================

    // Set template values -- page title and top header
    document.title = pageTitle;
    const topHeader = document.getElementById('topHeader');
    topHeader.innerHTML = pageHeader;

    // Create an overall object to keep track of the currently active recording
    const store = new appState();
    store.addEventListener('recordingChange', handleRecordingUpdate);

    // Create a few accessors for the necessary UI elements ----
    const annotationsDiv = document.getElementById('annotations');
    const searchResults = document.getElementById('searchResults');
    const filtersBoxHeader = document.getElementById('filtersBoxHeader');
    const filtersBoxBody = document.getElementById('filtersBoxBody');
    const clearAllBtnContainer = document.getElementById('clearAllBtnContainer');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const fileList = document.getElementById('fileList');
    const audio = document.getElementById('audio');

    // Instantiate custom controls ----
    const searchBox = new ClearableTextInput('searchBox', 'clearSearchBtn', 
                                             searchAnnotations);

    searchBox.input.placeholder = searchBoxPlaceholder;
    const speakerFilterBox = new ClearableTextInput('speakerFilterBox', 
                                                    'clearNameFilterBtn', 
                                                    filterFileList);


    // Create recording buttons ----
    const fileButtons = [];

    transcripts.forEach(file => {
        const btn = document.createElement('button');
        btn.textContent = file.displayName;

        btn.onclick = () => {
            store.setCurrentRecording(file.displayName)
        };

        btn.classList.add("file-button");

        fileList.appendChild(btn);
        fileButtons.push(btn);
    });

    // Create filters ----

    // Create lists of filter values
    const speakersAttrs = Object.fromEntries(
        // Assume that all speakers have the same list of attributes, so we can 
        // grab them from the first speakers
        Object.keys(speakers[0]).map(key => {
            let valuesList = [...new Set(speakers.map(item => item[key]))].sort();
            // Split by ";" it the values contain sub-values (we assume ";" as
            // the separator for sub-values)
            valuesList = [... new Set(valuesList.flatMap(v => v.split(";")))];
            // Put the "Not recorded" value last
            if (valuesList.includes("Not recorded")) {
                valuesList = [...valuesList.filter(item => item !== "Not recorded"), "Not recorded"];
            };

            return [key, valuesList];
        })
    );
    
    // Initialize tag pickers for each filter
    const tagPickers = Object.fromEntries(
        Object.entries(speakersAttrs)
            .filter(([key, value]) => key !== "Name")
            .map(([key, value]) => {    
                if (key == "Name") return [];
            
                const newPickerDiv = document.createElement("div");
                newPickerDiv.id = toSafeHtmlName(key) + "-picker";
                clearAllBtnContainer.before(newPickerDiv)
                
                return [key, new TagPicker(newPickerDiv.id, key, value, filterFileList)];
            })
    );

    // Auxiliary data variables to use in searching and filtering
    var filteredData = transcripts;

    // ==========================================
    // Event listeners
    // ==========================================

    // Note that some event listeners are instantiated as part of input
    // controls creations

    // --- Highlight current line during playback ---
    audio.addEventListener('timeupdate', () => {
        const state = store.getState()

        const currentTime = audio.currentTime * 1000;
        state.annotationButtons.forEach(btn => {
            const start = parseInt(btn.dataset.start);
            const end = parseInt(btn.dataset.end);
            if (currentTime >= start && currentTime <= end) {
                btn.classList.add('highlight');
                // Auto-scroll if the currently playing annotation reaches
                // the end of the screen
                if (btn.getBoundingClientRect().bottom > annotationsDiv.getBoundingClientRect().bottom) {
                    btn.scrollIntoView({behavior: 'smooth', block: 'center'})
                };
            } else {
                btn.classList.remove('highlight');
            }
        });
    });

    // --- Scroll to annotation if the user advanced the time manually ---
    //
    // I.e., if the user clicked on the audio control and changed to a 
    // different playback position
    audio.addEventListener('seeked', () => {
        const state = store.getState()

        const currentTime = audio.currentTime * 1000;

        const closest_annotation = state.annotationButtons.find(btn => {
            const start = parseInt(btn.dataset.start);
            const end = parseInt(btn.dataset.end);
            if (currentTime >= start && currentTime <= end) {
                return(true)
            }  else {
                return(false)
            }
        }
        )

        closest_annotation.scrollIntoView({behavior: 'smooth', block: 'center'})
    });

    // Clear all filters when clicking on Clear All button
    clearAllBtn.addEventListener('click', () => {
        Object.values(tagPickers).forEach(picker => picker.clear());
    });

</script>
